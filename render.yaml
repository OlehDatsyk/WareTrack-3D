# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Free web service that shares an EXISTING Render Postgres instance (a workspace can
# hold only one free Postgres). WareTrack keeps all of its tables in its own schema
# (DATABASE_SCHEMA), so it never touches the other application's data.
#
# The database is only *referenced* (fromDatabase), not declared under `databases:`,
# so this Blueprint never changes that database's configuration.
# To give WareTrack its own database instead, add a `databases:` entry and point
# fromDatabase at it (see DEPLOYMENT.md).
services:
  - type: web
    name: waretrack-3d
    runtime: node
    plan: free
    # Must match the region of the referenced database (internal connection).
    region: frankfurt
    buildCommand: npm ci && npm run build
    # Free instances have no pre-deploy step, so migrations and the first-run demo
    # seed run at startup (both are idempotent).
    startCommand: npx prisma migrate deploy && npm run db:seed-if-empty && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: remixfox-db
          property: connectionString
      - key: DATABASE_SCHEMA
        value: waretrack
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      # Password for the seeded demo accounts — Render generates a random value.
      # Read it in the dashboard (Environment tab) to sign in for the first time.
      - key: SEED_DEMO_PASSWORD
        generateValue: true
