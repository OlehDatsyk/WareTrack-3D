# Render Blueprint — https://render.com/docs/blueprint-spec
# Free web service. The PostgreSQL database is external (e.g. a free Neon or Supabase
# database) because a Render workspace can only hold one free Postgres instance.
# Paste its connection string as DATABASE_URL when Render asks (or in the Environment tab).
#
# To use a Render-managed database instead, add a `databases:` entry and set
# DATABASE_URL with `fromDatabase` (see DEPLOYMENT.md).
services:
  - type: web
    name: waretrack-3d
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # Free instances have no pre-deploy step, so migrations and the first-run demo
    # seed run at startup (both are idempotent).
    startCommand: npx prisma migrate deploy && npm run db:seed-if-empty && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # External PostgreSQL connection string, e.g.
      # postgresql://user:password@host/dbname?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: SEED_DEMO_DATA
        value: "true"
      # Password for the seeded demo accounts — Render generates a random value.
      # Read it in the dashboard (Environment tab) to sign in for the first time.
      - key: SEED_DEMO_PASSWORD
        generateValue: true
